<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--page:#dfeaff;--navy:#1f2f63;--red:#ef4b3f;--green:#33b864;--blue:#2d8be0;--sun:#ffb81f;--pink:#ff7ab6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0f1730}}
:root[data-theme="dark"]{--page:#0f1730}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;margin:0;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;-webkit-touch-callout:none}
body{background:#bfe6ff;font-family:Tajawal,Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;user-select:none}
#wrap{position:relative;width:1280px;height:720px;transform-origin:center center;flex:none}
#stage{position:absolute;inset:0;border-radius:0;overflow:hidden;background:linear-gradient(#7cc8ff,#bfe6ff 60%,#e9f7ff);box-shadow:0 18px 50px rgba(20,40,90,.35)}
/* scenery */
.sunbox{position:absolute;top:30px;left:40px;width:120px;height:120px}
.sun{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ffe58a,#ffb81f);box-shadow:0 0 0 18px rgba(255,214,90,.35),0 0 0 38px rgba(255,214,90,.15);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 24px rgba(255,214,90,.3),0 0 0 48px rgba(255,214,90,.1)}}
.cloud{position:absolute;background:#fff;border-radius:60px;height:46px;opacity:.95;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:60px;height:60px;top:-30px;right:22px}.cloud:after{width:44px;height:44px;top:-20px;right:72px}
@keyframes drift{from{transform:translateX(-1500px)}to{transform:translateX(300px)}}
.hill{position:absolute;bottom:0;left:0;width:100%;height:170px}

.bfly{position:absolute;font-size:34px;animation:fly 14s ease-in-out infinite}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(260px,-80px) rotate(10deg)}50%{transform:translate(520px,20px)}75%{transform:translate(240px,90px) rotate(-10deg)}100%{transform:translate(0,0)}}

#fsBtn{position:absolute;top:16px;left:20px;z-index:25;display:flex;align-items:center;gap:8px;border:none;border-radius:999px;background:#1f2f63;color:#fff;font-family:Tajawal,sans-serif;font-weight:900;font-size:24px;padding:10px 20px 10px 16px;box-shadow:0 6px 0 rgba(0,0,0,.25);cursor:pointer}

#toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%) translateY(20px);z-index:40;background:#1f2f63;color:#fff;font-weight:800;font-size:26px;padding:14px 26px;border-radius:24px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:.35s}

#kid{font-size:80px}#kid .kimg{height:100%;display:block;transform-origin:50% 100%;pointer-events:none}
.rxl{position:absolute;inset:0;pointer-events:none}

@keyframes rxup{0%{transform:translate(-50%,40px) scale(0)}20%{transform:translate(-50%,0) scale(1.25)}35%{transform:translate(-50%,-8px) scale(1)}100%{transform:translate(calc(-50% + var(--dx,0px)),-140px) scale(.9);opacity:0}}

@keyframes k-think{0%,100%{transform:rotate(0)}30%,60%{transform:rotate(-3.5deg) translateX(-6px)}}
#kid.r-clap .kimg{animation:k-clap .3s ease-in-out 2}

#kid.r-oops .kimg{animation:k-oops .5s ease-in-out 2}

#kid.r-wow .kimg{animation:k-wow .7s cubic-bezier(.3,1.7,.5,1)}

#kid.r-point .kimg{animation:k-point 1.4s ease-in-out}
@keyframes k-point{30%,70%{transform:translateX(-22px) rotate(-4deg)}}

#kid{position:absolute;bottom:18px;right:46px;height:640px;z-index:4;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite;transition:right .9s cubic-bezier(.3,1.4,.5,1),opacity .5s;filter:drop-shadow(0 10px 8px rgba(20,60,30,.25))}
#kid.off{right:-400px}
@keyframes breathe{50%{transform:translateY(-6px) scaleY(1.01)}}
#kid.talk{animation:breathe 3.2s ease-in-out infinite,nod .45s ease-in-out infinite}
@keyframes nod{50%{rotate:-1.6deg}}
#kid.jump{animation:jump .6s cubic-bezier(.3,.7,.4,1) 2}
@keyframes jump{40%{transform:translateY(-70px) rotate(-4deg)}70%{transform:translateY(0) scale(1.04,.96)}}
#kid.wave{animation:wave .5s ease-in-out 4}
@keyframes wave{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
#bubble{position:absolute;top:26px;right:330px;max-width:760px;background:#fff;border:5px solid var(--navy);border-radius:30px;padding:16px 28px;font-weight:900;font-size:34px;line-height:1.35;color:var(--navy);z-index:6;transform:scale(0);transform-origin:90% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#bubble.on{transform:scale(1)}
#bubble:after{content:"";position:absolute;right:-30px;bottom:18px;border:16px solid transparent;border-left:26px solid var(--navy);border-right:0}
#bubble b{color:var(--red)}
/* content */
#scene{position:absolute;top:150px;right:340px;left:30px;bottom:150px;z-index:5;display:flex;align-items:center;justify-content:center}
.title{font-family:Lalezar,sans-serif;font-size:96px;color:#fff;text-shadow:0 6px 0 var(--navy),0 10px 18px rgba(0,0,0,.25);display:flex;gap:6px}
.title span{display:inline-block;animation:popin .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes popin{from{transform:scale(0) rotate(-20deg);opacity:0}}
.subt{font-size:30px;font-weight:900;color:var(--navy);background:#fff;border-radius:999px;padding:8px 26px;margin-top:16px;animation:popin .6s 1.2s both}
.col{display:flex;flex-direction:column;align-items:center}
/* Toto the letter */
.toto{width:420px;animation:popin .8s cubic-bezier(.3,1.7,.5,1) both}
.toto .body{animation:hop 1.4s ease-in-out infinite;transform-origin:150px 200px}
@keyframes hop{50%{transform:translateY(-14px) scale(1.03,.97)}}
.toto .d1{animation:ball .8s ease-in-out infinite}.toto .d2{animation:ball .8s .4s ease-in-out infinite}
@keyframes ball{50%{transform:translateY(-30px)}}
.toto .lid{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.toto.glow .stroke{filter:drop-shadow(0 0 16px #fff)}
/* buttons, tiles */
.big-btn{font-family:Lalezar,sans-serif;font-size:56px;border:none;border-radius:40px;padding:14px 50px;color:#fff;background:var(--red);box-shadow:0 10px 0 #b12c23;cursor:pointer;animation:beat 1s ease-in-out infinite}
.big-btn:active{transform:translateY(8px);box-shadow:0 2px 0 #b12c23}
@keyframes beat{50%{scale:1.07}}
.grid{display:grid;grid-template-columns:repeat(3,210px);gap:22px}
.tile{position:relative;background:#fff;border-radius:30px;border:6px solid #fff;box-shadow:0 10px 0 rgba(31,47,99,.18);height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;animation:popin .5s cubic-bezier(.3,1.7,.5,1) both;transition:transform .2s}
.tile:hover{transform:translateY(-4px)}
.tile .em{font-size:96px;line-height:1.1}
.tile .w{font-size:38px;font-weight:900;color:var(--navy)}
.tile .w i{font-style:normal;color:var(--red)}
.tile.ok{border-color:var(--green);background:#eaffef;animation:yay .6s}
.tile.ok:after{content:"⭐";position:absolute;top:-26px;left:-20px;font-size:54px;animation:popin .5s both}
.tile.no{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes yay{50%{transform:scale(1.15) rotate(3deg)}}
.word-card{background:#fff;border-radius:40px;padding:20px 60px;box-shadow:0 14px 0 rgba(31,47,99,.18);display:flex;flex-direction:column;align-items:center;animation:flyin .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes flyin{from{transform:translateY(-500px) rotate(-30deg)}}
.word-card .em{font-size:200px;line-height:1.05;animation:hop 1.2s ease-in-out infinite}
.word-card .w{font-family:Lalezar,sans-serif;font-size:96px;color:var(--navy);line-height:1.1}
.word-card .w i{font-style:normal;color:var(--red);display:inline-block;animation:beat .8s ease-in-out infinite}
.counter{display:flex;gap:16px;margin-top:20px}
.counter span{font-size:60px;filter:grayscale(1) opacity(.35);transition:.3s}
.counter span.on{filter:none;animation:popin .5s}
.croc{position:absolute;left:30px;bottom:120px;font-size:130px;z-index:5;transform:scaleX(-1);animation:croc 1.6s ease-in-out infinite}
.croc.eat{animation:chomp .25s 4}
@keyframes croc{50%{transform:scaleX(-1) translateY(-10px)}}
@keyframes chomp{50%{transform:scaleX(-1) scale(1.2) rotate(-10deg)}}
.fly{position:fixed;z-index:50;font-size:96px;pointer-events:none;transition:all .7s cubic-bezier(.5,-.3,.6,1)}
/* tracing */
.trace{position:relative;width:640px;height:400px;background:#fff;border-radius:36px;box-shadow:0 14px 0 rgba(31,47,99,.18);overflow:hidden}
.trace svg,.trace canvas{position:absolute;inset:0;width:100%;height:100%}
.done-btn{position:absolute;bottom:-90px;left:50%;transform:translateX(-50%);font-size:40px;padding:8px 40px;animation:none}
/* chrome */

#dots i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.6);border:3px solid #fff}

#start{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:rgba(31,47,99,.55);backdrop-filter:blur(3px)}
.curtain{position:absolute;top:0;bottom:0;width:51%;z-index:19;background:repeating-linear-gradient(90deg,#d8332a 0 50px,#b8241c 50px 100px);transition:transform 1.4s cubic-bezier(.7,0,.3,1)}
.curtain.l{left:0}.curtain.r{right:0}
.open .curtain.l{transform:translateX(-100%)}.open .curtain.r{transform:translateX(100%)}
.confetti{position:absolute;top:-30px;width:16px;height:24px;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(1700px) rotate(720deg)}}
.burst{position:absolute;z-index:30;font-size:50px;pointer-events:none;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.land #scene.game{left:200px}
.narrow #scene.game{left:150px}
.tall #scene.game{left:30px}.tall .grid{grid-template-columns:repeat(2,250px)}.tall .grid .tile{height:200px}.tall #scene{top:190px}.narrow .croc{font-size:100px}.narrow #bubble{font-size:30px}
.title{flex-wrap:wrap;justify-content:center;text-align:center}

<script>
const $=s=>document.querySelector(s);
const wrap=$('#wrap'),stage=$('#stage'),scene=$('#scene'),bubble=$('#bubble'),kid=$('#kid');
let DW=1280,DH=720;
function fit(){const vv=window.visualViewport,W=vv?vv.width:innerWidth,H=vv?vv.height:innerHeight,r=H/W,por=r>=1.45;
 if(por){DW=720;DH=Math.round(Math.min(1600,Math.max(1040,720*r)))}else{DW=Math.round(Math.min(1700,Math.max(940,720/r)));DH=Math.round(Math.min(1300,Math.max(720,DW*r)))}
 wrap.classList.toggle('por',por);wrap.classList.toggle('land',!por);wrap.classList.toggle('narrow',!por&&DW<1150);wrap.classList.toggle('tall',!por&&DH>860);
 wrap.style.width=DW+'px';wrap.style.height=DH+'px';
 let kh,kw;if(por){kh=Math.round(DH*.38);scene.style.bottom=(kh-30)+'px';scene.style.right='';bubble.style.right=''}
 else{kh=Math.round(Math.min(DH*.89,780,DW*.52/0.365));kw=kh*.365;scene.style.bottom='150px';scene.style.right=Math.round(kw+70)+'px';bubble.style.right=Math.round(kw+90)+'px'}
 kid.style.height=kh+'px';
 wrap.style.transform='scale('+Math.min(W/DW,H/DH)+')';fitScene()}
function fitScene(){const el=scene.firstElementChild;if(!el)return;el.style.scale='';const k=Math.min(1,(scene.clientWidth-12)/el.offsetWidth,(scene.clientHeight-12)/el.offsetHeight);if(k<1)el.style.scale=k}
new MutationObserver(()=>requestAnimationFrame(fitScene)).observe(scene,{childList:true});
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));if(window.visualViewport)visualViewport.addEventListener('resize',fit);
fit();
// ---------- sound ----------
let AC=null,muted=false;
function tone(f,d,t=0,type='sine',v=.18){if(muted||!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime+t);g.gain.setValueAtTime(v,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}
const sfx={pop:()=>{tone(600,.12,0,'triangle');tone(900,.1,.05,'triangle')},
 ding:()=>[784,988,1319].forEach((f,i)=>tone(f,.35,i*.1,'triangle')),
 no:()=>{tone(220,.25,0,'square',.08);tone(180,.3,.15,'square',.08)},
 fan:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.3,i*.13,'triangle')),
 boing:()=>{if(muted||!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(200,AC.currentTime);o.frequency.exponentialRampToValueAtTime(700,AC.currentTime+.25);g.gain.setValueAtTime(.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.35);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+.35)}};
// ---------- voice ----------
let voice=null;const tts='speechSynthesis' in window;
function pick(){if(!tts)return;const v=speechSynthesis.getVoices().filter(x=>/^ar/i.test(x.lang));voice=v.find(x=>/female|zira|hoda|laila|maged|google/i.test(x.name))||v[0]||null}
if(tts){pick();speechSynthesis.onvoiceschanged=pick}
let run=0;const alive=id=>id===run;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function say(html,speak){
 const text=speak||html.replace(/<[^>]+>/g,'');
 bubble.innerHTML=html;bubble.classList.remove('on');void bubble.offsetWidth;bubble.classList.add('on');
 kid.classList.add('talk');
 return new Promise(res=>{let done=false;const fin=()=>{if(done)return;done=true;kid.classList.remove('talk');res()};
  const est=Math.max(2200,text.length*95);
  if(!muted&&tts&&voice){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=voice;u.lang=voice.lang;u.rate=.8;u.pitch=1.35;u.onend=fin;u.onerror=()=>setTimeout(fin,est);speechSynthesis.speak(u);setTimeout(fin,est+6000)}
  else setTimeout(fin,est)});
}
