:root{--navy:#1f2f63;--red:#ef4b3f;--green:#33b864;--blue:#2d8be0;--sun:#ffb81f;--pink:#ff7ab6;--purple:#8a5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;height:100dvh;overflow:hidden;background:#bfe6ff;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:Tajawal,Tahoma,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;flex:none;transform-origin:center center}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#5fb2ff,#bfe6ff 62%,#e9f7ff)}
.sun{position:absolute;top:96px;left:40px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff1a8,#ffc21f);box-shadow:0 0 0 16px rgba(255,214,90,.3),0 0 0 34px rgba(255,214,90,.14);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 22px rgba(255,214,90,.25),0 0 0 44px rgba(255,214,90,.08)}}
.cloud{position:absolute;background:#fff;border-radius:60px;height:44px;opacity:.95;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:58px;height:58px;top:-28px;right:20px}.cloud:after{width:42px;height:42px;top:-18px;right:68px}
@keyframes drift{from{transform:translateX(-1500px)}to{transform:translateX(400px)}}
.hills{position:absolute;bottom:0;left:0;width:100%;height:150px}
/* top bar */
#bar{position:absolute;top:0;left:0;right:0;height:84px;display:flex;align-items:center;gap:12px;padding:0 18px;z-index:30}
.ib{width:66px;height:66px;border-radius:50%;border:none;background:#fff;color:var(--navy);font-size:30px;box-shadow:0 6px 0 rgba(31,47,99,.22);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.ib:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(31,47,99,.22)}
#stars{margin-inline-start:auto;background:#fff;border-radius:999px;padding:8px 20px;font-family:Lalezar;font-size:34px;color:var(--navy);box-shadow:0 6px 0 rgba(31,47,99,.22);display:flex;align-items:center;gap:8px}
#stars.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.25)}}
#btitle{font-family:Lalezar;font-size:40px;color:#fff;text-shadow:0 4px 0 var(--navy)}
/* screens */
.scr{position:absolute;inset:84px 0 0 0;display:none}
.scr.on{display:block;animation:scrin .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes scrin{from{opacity:0;transform:scale(.94)}}
h1.big{font-family:Lalezar;font-weight:400;color:#fff;text-shadow:0 7px 0 var(--navy),0 12px 20px rgba(0,0,0,.2);line-height:1.1}
.card{position:absolute;border:none;border-radius:36px;background:#fff;box-shadow:0 12px 0 rgba(31,47,99,.2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:Lalezar;color:var(--navy);transition:transform .15s}
.card:active{transform:translateY(8px);box-shadow:0 4px 0 rgba(31,47,99,.2)}
.card .em{font-size:110px;line-height:1}
.card .lb{font-size:44px}
.card .sm{font-family:Tajawal;font-weight:800;font-size:22px;color:#5a6690}
.wob{animation:wob 2.4s ease-in-out infinite}@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
/* Aws rig */
#aws{position:absolute;z-index:20;width:405px;height:1111px;transform-origin:0 0;transition:left .7s cubic-bezier(.3,1.3,.5,1),top .7s cubic-bezier(.3,1.3,.5,1),transform .7s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
#aws .bd{position:absolute;inset:0;transform-origin:202px 1111px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.008) translateY(-4px)}}
#aws .bd>img{position:absolute;left:0;top:0;width:405px}
#head{position:absolute;left:0;top:0;width:405px;height:368px;transform-origin:245px 356px;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.hv{position:absolute;left:0;top:0;width:405px;opacity:0}
#aws.jump .bd{animation:jump .7s cubic-bezier(.3,.7,.4,1) 2}
@keyframes jump{0%{transform:none}15%{transform:scale(1.04,.94)}45%{transform:translateY(-130px) scale(.98,1.04)}75%{transform:none}85%{transform:scale(1.05,.93)}}
#aws.sad .bd{animation:sadb 1.8s ease-in-out forwards}
@keyframes sadb{20%{transform:translateY(16px) scale(1,.96) rotate(2deg)}60%{transform:translateY(16px) scale(1,.96) rotate(-1.5deg)}100%{transform:translateY(8px) scale(1,.98)}}
#aws.wave .bd{animation:wave .5s ease-in-out 4}@keyframes wave{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
#bubble{position:absolute;z-index:25;background:#fff;border:5px solid var(--navy);border-radius:30px;padding:14px 26px;font-weight:900;font-size:32px;line-height:1.35;color:var(--navy);max-width:640px;transform:scale(0);transform-origin:var(--ox,10%) 100%;transition:transform .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
#bubble.on{transform:scale(1)}#bubble b{color:var(--red)}
.rx{position:absolute;z-index:26;font-size:70px;pointer-events:none;animation:rxup 1.5s ease-out forwards}
@keyframes rxup{0%{transform:translateY(30px) scale(0)}20%{transform:scale(1.25)}100%{transform:translateY(-130px) scale(.9);opacity:0}}
/* paint */
#pwrap{position:absolute;background:#fff;border-radius:30px;box-shadow:0 12px 0 rgba(31,47,99,.2);overflow:hidden;touch-action:none}
#pwrap canvas{position:absolute;inset:0;width:100%;height:100%}
#lines{pointer-events:none}
#tools{position:absolute;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:flex-start}
.col{width:64px;height:64px;border-radius:50%;border:5px solid #fff;box-shadow:0 5px 0 rgba(31,47,99,.25);cursor:pointer;transition:transform .15s}
.col.sel{transform:scale(1.22);border-color:var(--navy)}
.tl{width:78px;height:72px;border-radius:22px;border:none;background:#fff;font-size:36px;box-shadow:0 5px 0 rgba(31,47,99,.25);cursor:pointer}
.tl.sel{background:var(--sun);transform:translateY(-4px)}
.done{font-family:Lalezar;font-size:38px;color:#fff;background:var(--green);border:none;border-radius:999px;padding:8px 34px;box-shadow:0 7px 0 #1f8a45;cursor:pointer}
.gcard{position:absolute;width:250px;height:290px}
.gcard canvas{width:180px;height:180px;border-radius:18px;background:#f4f8ff}
/* games */
#bfield{position:absolute;inset:0;overflow:hidden}
.balloon{position:absolute;width:150px;height:186px;cursor:pointer;touch-action:none}
.balloon .bl{position:absolute;left:0;top:0;width:150px;height:170px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;box-shadow:inset -14px -18px 0 rgba(0,0,0,.12),inset 14px 14px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-family:Lalezar;font-size:96px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.2)}
.balloon .str{position:absolute;left:73px;top:170px;width:3px;height:90px;background:rgba(31,47,99,.4)}
.balloon.no{animation:shake .45s}@keyframes shake{25%,75%{margin-left:-14px}50%{margin-left:14px}}
.pop{position:absolute;pointer-events:none;font-size:64px;animation:popx .6s ease-out forwards}@keyframes popx{to{transform:scale(2.2);opacity:0}}
#target{position:absolute;z-index:22;background:#fff;border-radius:30px;box-shadow:0 8px 0 rgba(31,47,99,.2);display:flex;align-items:center;gap:14px;padding:6px 26px;font-family:Lalezar;font-size:36px;color:var(--navy)}
#target b{font-size:80px;color:var(--red);line-height:1}
#prog{display:flex;gap:6px}#prog i{font-style:normal;font-size:34px;filter:grayscale(1) opacity(.35)}#prog i.on{filter:none;animation:bump .4s}
.pic{position:absolute;background:#fff;border-radius:40px;box-shadow:0 12px 0 rgba(31,47,99,.2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.pic .em{font-size:170px;line-height:1.05;animation:wob 2.2s ease-in-out infinite}
.pic .w{font-family:Lalezar;font-size:90px;color:var(--navy);line-height:1.1}
.pic .w .gap{display:inline-block;min-width:70px;border-bottom:8px dashed var(--sun);color:var(--red)}
.lbtn{position:absolute;width:170px;height:170px;border-radius:40px;border:none;font-family:Lalezar;font-size:120px;color:#fff;box-shadow:0 10px 0 rgba(0,0,0,.2);cursor:pointer;line-height:1}
.lbtn:active{transform:translateY(6px)}
.lbtn.no{animation:shake .45s;filter:grayscale(.6)}
.lbtn.ok{animation:bump .5s;outline:8px solid #fff}
.confetti{position:absolute;top:-30px;width:16px;height:24px;z-index:60;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(1500px) rotate(720deg)}}
#start{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(31,47,99,.6);backdrop-filter:blur(3px)}
.go{font-family:Lalezar;font-size:56px;color:#fff;background:var(--red);border:none;border-radius:999px;padding:12px 56px;box-shadow:0 10px 0 #b12c23;cursor:pointer;animation:beat 1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.07)}}
button:focus-visible,.card:focus-visible{outline:5px solid var(--sun);outline-offset:4px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const wrap=$('#wrap'),stage=$('#stage'),aws=$('#aws'),bubble=$('#bubble');
let DW=1280,DH=720,POR=false;
/* ---------- layout ---------- */
function fit(){const vv=window.visualViewport,W=vv?vv.width:innerWidth,H=vv?vv.height:innerHeight,r=H/W;POR=r>=1.15;
 if(POR){DW=720;DH=Math.round(Math.min(1560,Math.max(1100,720*r)))}else{DW=Math.round(Math.min(1700,Math.max(1100,720/r)));DH=720}
 wrap.style.width=DW+'px';wrap.style.height=DH+'px';wrap.style.transform='scale('+Math.min(W/DW,H/DH)+')';layout()}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));if(window.visualViewport)visualViewport.addEventListener('resize',fit);
const P=(el,x,y,w,h)=>{if(typeof el==='string')el=$(el);if(!el)return;el.style.left=x+'px';el.style.top=y+'px';if(w!=null)el.style.width=w+'px';if(h!=null)el.style.height=h+'px'};
let screen='home';
function placeAws(x,y,s){aws.style.transform=`scale(${s})`;aws.style.left=x+'px';aws.style.top=(y-1111*s)+'px';aws._b={x,y,s}}
function layout(){const CH=DH-84;
 $('#bar').style.width=DW+'px';
 if(screen==='home'){
  if(POR){P('#hTitle',0,30);$('#hTitle').style.width='720px';$('#hTitle').style.fontSize='120px';P('#hSub',0,190);$('#hSub').style.left=(DW/2)+'px';$('#hSub').style.transform='translateX(-50%)';
   P('#cPaint',380,280,300,300);P('#cGames',40,280,300,300);placeAws(DW/2-130,DH-60,.55)}
  else{P('#hTitle',0,6);$('#hTitle').style.width=(DW-420)+'px';$('#hTitle').style.fontSize='108px';P('#hSub',(DW-420)/2,150);$('#hSub').style.transform='translateX(-50%)';
   const cx=(DW-420)/2;P('#cPaint',cx+20,290,330,300);P('#cGames',cx-350,290,330,300);placeAws(DW-330,DH-20,.6)}}
 if(screen==='gal'){const n=GP.length;if(POR){const cols=2,w=300,h=330;GP.forEach((p,i)=>P('#gc'+i,DW-60-w-(i%cols)*(w+40),40+Math.floor(i/cols)*(h+30),w,h));placeAws(30,DH-20,.32)}
  else{const cols=3,w=250,h=272,gp=24,area=DW-300,ox=(area-(cols*w+(cols-1)*gp))/2;GP.forEach((p,i)=>P('#gc'+i,area-ox-w-(i%cols)*(w+gp),24+Math.floor(i/cols)*(h+gp),w,h));placeAws(DW-250,DH-20,.5)}}
 if(screen==='paint'){if(POR){const s=DW-40;P('#pwrap',20,20,s,s);P('#tools',20,s+40,DW-40,CH-s-60);placeAws(DW-150,DH+10,.2)}
  else{const s=CH-40;P('#pwrap',(DW-s)/2+150,20,s,s);P('#tools',DW-((DW-s)/2+150)+ -0,20,(DW-s)/2-170,s);$('#tools').style.left='20px';$('#tools').style.width=((DW-s)/2+110)+'px';placeAws(DW-((DW-s)/2-130),DH-20,.42)}}
 if(screen==='gm'){if(POR){P('#gBal',380,100,300,320);P('#gFirst',40,100,300,320);placeAws(DW/2-130,DH-40,.55)}else{const cx=(DW-420)/2;P('#gBal',cx+20,120,330,330);P('#gFirst',cx-350,120,330,330);placeAws(DW-330,DH-20,.6)}}
 if(screen==='bal'){P('#target',20,12);placeAws(POR?DW-170:DW-260,DH-10,POR?.25:.42)}
 if(screen==='first'){if(POR){P('#picC',60,40,600,520);[0,1,2].forEach(i=>P('#lb'+i,40+i*230,620,170,170));placeAws(DW-200,DH-10,.3)}
  else{P('#picC',DW/2-140,14,560,400);[0,1,2].forEach(i=>P('#lb'+i,DW/2-140+i*195,440,170,170));placeAws(170,DH-20,.5)}}
 placeBubble()}
function placeBubble(){const b=aws._b;if(!b)return;const hx=b.x+245*b.s,hy=b.y-1111*b.s;const w=Math.min(640,DW-60);bubble.style.maxWidth=w+'px';

function savePic(){const c=document.createElement('canvas');c.width=c.height=800;const x=c.getContext('2d');x.drawImage(pc,0,0);x.drawImage(lc,0,0);x.font='400 34px Lalezar';x.fillStyle='#1f2f63';x.textAlign='left';x.fillText('عالم أوس 🎨',20,780);
 const a=document.createElement('a');a.download='لوحتي_'+cur.name+'.png';a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();sfx.ding();say('حُفظت لوحتك! 💾','حُفظت لوحتُك!',2500)}
function finishPic(){if(painted<3){setMood('think',1800);say('لوّن قليلاً بعد 🎨 ثم اضغط انتهيت!','لوّن قليلاً بعد، ثم اضغط انتهيت!',3000);return}
 confetti(90);sfx.fan();addStars(3);happy('لوحة رائعة! 🏆 ربحت ٣ نجوم ⭐⭐⭐','لوحةٌ رائعة! ربحتَ ثلاثَ نجوم!');painted=0}
/* ======================= BALLOONS ======================= */
const LETS=['ر','ت','ب','م','س','ش'];const BCOL=['#ef4b3f','#2d8be0','#33b864','#ffb81f','#8a5cf6','#ff7ab6','#ff8a1f'];
let balRAF=null,balls=[],target='ر',got=0,round=0,spawnT=0,lastTs=0;
function stopBal(){cancelAnimationFrame(balRAF);balRAF=null;balls.forEach(b=>b.el.remove());balls=[]}
function startBal(){stopBal();round=0;nextRound()}
function nextRound(){target=LETS[round%LETS.length];if(round>0&&round%LETS.length===0){}got=0;$('#tl').textContent=target;$('#prog').innerHTML='⭐⭐⭐⭐⭐'.split('').filter(x=>x.trim()).map(()=>'<i>⭐</i>').join('');
 setMood('think');say(`اصطد البالونات التي عليها حرف <b>${target}</b>! 🎈`,`اصطد البالوناتِ التي عليها حرفُ ${target}`,4000);setTimeout(()=>sayLetter(target),2600);lastTs=0;spawnT=0;balRAF=requestAnimationFrame(tick)}
function spawn(){const el=document.createElement('div');el.className='balloon';const isT=Math.random()<.42;const L=isT?target:LETS.filter(l=>l!==target)[Math.floor(Math.random()*(LETS.length-1))];
 el.innerHTML=`<div class="bl" style="background:${BCOL[Math.floor(Math.random()*BCOL.length)]}">${L}</div><div class="str"></div>`;const maxX=(screen==='bal'?(POR?DW-170:DW-460):DW)-20;
 const b={el,L,x:20+Math.random()*Math.max(100,maxX-20),y:DH,v:(POR?110:90)+Math.random()*60+round*8,ph:Math.random()*6};el.style.left=b.x+'px';el.style.top=b.y+'px';
 el.addEventListener('pointerdown',e=>{e.preventDefault();hitBal(b)});$('#bfield').appendChild(el);balls.push(b)}
function hitBal(b){if(b.dead)return;if(b.L===target){b.dead=true;sfx.bal();const p=document.createElement('div');p.className='pop';p.textContent='💥';p.style.left=(b.x+40)+'px';p.style.top=(b.y+40)+'px';$('#bfield').appendChild(p);setTimeout(()=>p.remove(),600);b.el.remove();
  got++;$$('#prog i').forEach((x,i)=>x.classList.toggle('on',i<got));sayLetter(target);
  if(got>=5){addStars(2);confetti(70);sfx.fan();happy(`رائع! اصطدت ٥ بالونات <b>${target}</b> 🏆`,`رائع! اصطدتَ خمسَ بالونات`);round++;cancelAnimationFrame(balRAF);setTimeout(()=>{balls.forEach(x=>x.el.remove());balls=[];if(screen==='bal')nextRound()},3200)}
  else{setMood('joy',900);anim('jump',800);emo('⭐');sfx.ding()}}
 else{b.el.classList.remove('no');void b.el.offsetWidth;b.el.classList.add('no');sfx.no();sad(`هذا حرف <b>${b.L}</b> 🙂 نريد حرف <b>${target}</b>`,`هذا حرفُ ${b.L}. نريدُ حرفَ ${target}`)}}
function tick(ts){if(!lastTs)lastTs=ts;const dt=Math.min(.05,(ts-lastTs)/1000);lastTs=ts;spawnT-=dt;if(spawnT<=0){spawn();spawnT=.9+Math.random()*.7}
 balls.forEach(b=>{b.y-=b.v*dt;b.ph+=dt*2;b.el.style.top=b.y+'px';b.el.style.transform=`translateX(${Math.sin(b.ph)*14}px) rotate(${Math.sin(b.ph)*5}deg)`;if(b.y<-260){b.dead=true;b.el.remove()}});balls=balls.filter(b=>!b.dead||b.el.isConnected);balls=balls.filter(b=>b.el.isConnected);
 balRAF=requestAnimationFrame(tick)}
/* ======================= FIRST LETTER ======================= */
const WORDS=[['🍎','تفاحة','ت'],['🐊','تمساح','ت'],['👑','تاج','ت'],['🪶','ريشة','ر'],['📻','راديو','ر'],['✉️','رسالة','ر'],['🦆','بطة','ب'],['🏠','بيت','ب'],['🚪','باب','ب'],['🍌','موز','م'],['🔑','مفتاح','م'],['☂️','مظلة','م'],['🐟','سمكة','س'],['🚗','سيارة','س'],['⌚','ساعة','س'],['☀️','شمس','ش'],['🌳','شجرة','ش']];
const LC=['#ef4b3f','#2d8be0','#33b864'];let fq=[],fi=0,fBusy=false;
function startFirst(){fq=WORDS.slice().sort(()=>Math.random()-.5).slice(0,8);fi=0;$('#lbs').innerHTML=[0,1,2].map(i=>`<button class="lbtn" id="lb${i}" style="background:${LC[i]}"></button>`).join('');layout();nextQ()}
function nextQ(){if(fi>=fq.length){addStars(3);confetti(90);sfx.fan();happy('أنهيت كل الصور! 🏆 ربحت ٣ نجوم ⭐','أنهيتَ كلَّ الصور! ربحتَ ثلاثَ نجوم');setTimeout(()=>{if(screen==='first')startFirst()},4200);return}
 const [e,w,l]=fq[fi];fBusy=false;$('#picE').textContent=e;$('#picW').innerHTML=`<span class="gap">&nbsp;</span>${w.slice(1)}`;
 const opts=[l,...LETS.filter(x=>x!==l).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);
 opts.forEach((o,i)=>{const b=$('#lb'+i);b.textContent=o;b.className='lbtn';b.onclick=()=>pickL(b,o,l,w)});
 setMood('think');say(`بأي حرف تبدأ كلمة <b>${w}</b>؟ ${e}`,`بأيِّ حرفٍ تبدأُ كلمةُ ${w}؟`,5000)}
function pickL(b,o,l,w){if(fBusy)return;if(o===l){fBusy=true;b.classList.add('ok');sfx.ding();$('#picW').innerHTML=`<span style="color:var(--red)">${l}</span>${w.slice(1)}`;addStars(1);happy(`صحيح! <b>${w}</b> تبدأ بحرف <b>${l}</b> 🎉`,`صحيح! ${w} تبدأُ بحرفِ ${l}`);fi++;setTimeout(()=>{if(screen==='first')nextQ()},2800)}
 else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');sfx.no();sad(`هذا حرف <b>${o}</b> 🙂 جرّب مرة أخرى`,`هذا حرفُ ${o}. جرّب مرةً أخرى`)}}
/* init */
face('base');fit();
const imL=$('#awsLines');Promise.all([document.fonts?document.fonts.load('400 100px Lalezar').catch(()=>{}):0,imL.complete?0:new Promise(r=>{imL.onload=r;imL.onerror=r})]).then(()=>{buildGallery();layout()});
